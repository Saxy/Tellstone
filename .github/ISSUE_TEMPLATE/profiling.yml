name: Profiling
description: Report a performance issue, request profiling guidance, or share profiling results
labels: ["performance", "profiling"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for CPU/memory profiling results, performance regressions,
        or requests for profiling guidance. For feature-level performance requests,
        use **Feature / Enhancement** instead.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - CPU profiling
        - Memory profiling (heap)
        - Mutex contention
        - Block profiling
        - Execution trace
        - Performance regression
        - Profiling setup / guidance request
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tellstone version
      placeholder: "e.g. 1.2.3 or abc1234"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Hardware, OS, core count, RAM."
      placeholder: "e.g. Intel Xeon 8580, 56 cores, 118GB RAM, Debian"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the performance issue or what you're trying to profile.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How did you generate the profile or observe the performance issue?
      placeholder: |
        1. Start server with `task run:profiling`
        2. Run `task bench:native` in a second terminal
        3. Pull profile with `task profile:live`
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Profiling results
      description: Paste pprof output, flame graph summaries, or key findings.
      render: text

  - type: textarea
    id: expected
    attributes:
      label: Expected performance
      description: What performance level did you expect?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Attach profile files, screenshots, or links to flame graphs.
